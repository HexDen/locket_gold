<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 Locket Gold AI Simulator - HexDen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #07090e; }
        .phone-frame {
            width: 390px;
            height: 780px;
            border-radius: 48px;
            box-shadow: 0 25px 60px -15px rgba(0, 229, 255, 0.2), 0 0 0 12px #1e293b, 0 0 0 14px #0f172a;
        }
        .notch {
            width: 120px;
            height: 32px;
            border-radius: 20px;
            background: #000;
        }
        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.03); }
        }
        .anim-pulse { animation: pulse-glow 1.8s infinite ease-in-out; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container Simulator -->
    <div class="relative phone-frame bg-[#14231b] flex flex-col overflow-hidden text-white select-none">
        
        <!-- Status Bar -->
        <div class="pt-3 px-7 flex justify-between items-center z-30">
            <span class="text-xs font-bold tracking-tight">14:00</span>
            <div class="notch flex items-center justify-center space-x-2">
                <div class="w-2.5 h-2.5 rounded-full bg-red-600"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-slate-800"></div>
            </div>
            <div class="flex items-center space-x-1.5 text-xs">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Header Controls -->
        <div class="px-5 pt-3 pb-2 flex justify-between items-center z-20">
            <button class="w-9 h-9 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-yellow-400 text-sm">
                <i class="fa-solid fa-bolt"></i>
            </button>
            <div class="px-3 py-1 bg-black/40 backdrop-blur-md rounded-full text-xs font-bold flex items-center space-x-1.5">
                <span>Gửi đến...</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
            </div>
            <button class="w-9 h-9 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center text-cyan-400 text-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </button>
        </div>

        <!-- Camera Viewfinder -->
        <div class="relative flex-1 mx-4 my-2 rounded-3xl overflow-hidden bg-black border border-white/10 shadow-inner flex items-center justify-center">
            
            <!-- Video / Uploaded Image -->
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
            <img id="previewImg" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=800&auto=format&fit=crop" alt="Camera Feed">

            <!-- "ĐANG RỬA ẢNH" Overlay -->
            <div id="developingOverlay" class="absolute inset-0 bg-black/50 backdrop-blur-md flex flex-col items-center justify-center hidden z-20">
                <div class="px-5 py-2.5 rounded-full bg-black/75 border border-white/20 shadow-2xl flex items-center space-x-2 text-white font-bold text-sm anim-pulse">
                    <span class="text-yellow-400 text-base">✨</span>
                    <span class="tracking-wide">ĐANG RỬA ẢNH</span>
                </div>
            </div>

            <!-- Dots Indicator khi đã rửa ảnh xong (• • • • ⚪ • •) -->
            <div id="dotsIndicator" class="absolute bottom-3 left-0 right-0 flex justify-center items-center space-x-1.5 z-10 hidden">
                <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
                <div class="w-2 h-2 rounded-full bg-white"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-white/40"></div>
            </div>

            <!-- Nút Thêm tin nhắn / Chú thích -->
            <button id="btnCaption" onclick="toggleCaptionSheet()" class="absolute bottom-8 px-4 py-1.5 bg-black/60 backdrop-blur-md border border-white/10 rounded-full text-xs font-semibold hover:bg-black/80 transition hidden z-10">
                Thêm một tin nhắn
            </button>
        </div>

        <!-- Filter Name Display -->
        <div class="text-center h-6 flex items-center justify-center">
            <span id="filterLabel" class="text-xs font-bold text-white/90 drop-shadow">HexDen VIP ✨</span>
        </div>

        <!-- Horizontal Filter Bar (Giống hệt Video) -->
        <div class="px-3 py-1">
            <div class="flex items-center justify-center space-x-3 overflow-x-auto no-scrollbar py-1">
                <!-- Close Filter -->
                <button onclick="selectFilter('none', 'Mặc định (Không filter)')" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-sm transition">
                    <i class="fa-solid fa-xmark text-slate-300"></i>
                </button>
                <!-- Sakura / Anime -->
                <button onclick="selectFilter('anime_art', '🌸 Sakura Anime (Ghibli)')" class="w-11 h-11 rounded-full bg-pink-500/20 hover:scale-110 border-2 border-pink-400 flex items-center justify-center text-xl transition">
                    🌸
                </button>
                <!-- Snowflake -->
                <button onclick="selectFilter('snowflake', '❄️ Snowflake (Mùa Đông)')" class="w-10 h-10 rounded-full bg-cyan-500/20 hover:scale-110 border border-cyan-400 flex items-center justify-center text-xl transition">
                    ❄️
                </button>
                <!-- Sunset -->
                <button onclick="selectFilter('sunset', '🌅 Sunset (Hoàng Hôn)')" class="w-10 h-10 rounded-full bg-amber-500/20 hover:scale-110 border border-amber-400 flex items-center justify-center text-xl transition">
                    🌅
                </button>
                <!-- Surfboard -->
                <button onclick="selectFilter('surfboard', '🏄 Surfboard (Mùa Hè)')" class="w-10 h-10 rounded-full bg-blue-500/20 hover:scale-110 border border-blue-400 flex items-center justify-center text-xl transition">
                    🏄
                </button>
                <!-- Vintage Film -->
                <button onclick="selectFilter('vintage_film', '🎞️ Đang Rửa Ảnh (Vintage)')" class="w-10 h-10 rounded-full bg-yellow-500/20 hover:scale-110 border border-yellow-400 flex items-center justify-center text-xl transition">
                    🎞️
                </button>
                <!-- OOTD -->
                <button onclick="selectFilter('ootd', '👕 OOTD (Thời Trang)')" class="w-10 h-10 rounded-full bg-emerald-500/20 hover:scale-110 border border-emerald-400 flex items-center justify-center text-xl transition">
                    👕
                </button>
            </div>
        </div>

        <!-- Bottom Shutter & Controls -->
        <div class="px-8 pt-2 pb-6 flex justify-between items-center z-10">
            <!-- Choose Photo / File -->
            <label class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center cursor-pointer transition">
                <i class="fa-regular fa-image text-lg"></i>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </label>

            <!-- Shutter Button (Chụp / Rửa Ảnh) -->
            <button id="shutterBtn" onclick="takePhoto()" class="w-18 h-18 w-[72px] h-[72px] rounded-full border-4 border-white/80 p-1 flex items-center justify-center transition active:scale-95">
                <div id="shutterInner" class="w-full h-full rounded-full bg-white shadow-lg flex items-center justify-center">
                </div>
            </button>

            <!-- Switch Cam / Webcam -->
            <button onclick="toggleWebcam()" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center transition">
                <i class="fa-solid fa-arrows-rotate text-lg"></i>
            </button>
        </div>

        <!-- Caption Bottom Sheet (Bảng nhãn dán như Video) -->
        <div id="captionSheet" class="absolute inset-x-0 bottom-0 bg-[#16221c] border-t border-white/10 rounded-t-3xl p-5 shadow-2xl transform translate-y-full transition-transform duration-300 z-30">
            <div class="w-10 h-1 bg-white/30 rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm text-slate-300">Chú thích</h3>
                <button onclick="toggleCaptionSheet()" class="text-xs text-slate-400 hover:text-white">Đóng</button>
            </div>

            <!-- ✨ Nhãn của tôi (HexDen) -->
            <p class="text-xs font-bold text-yellow-400 flex items-center space-x-1 mb-2">
                <span>✨</span> <span>Nhãn của tôi</span>
            </p>
            <div class="flex flex-wrap gap-2 mb-4">
                <span class="px-3 py-1.5 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-xs font-bold shadow">
                    👑 HexDen (Văn Nguyên)
                </span>
                <span class="px-3 py-1.5 rounded-full bg-slate-800 border border-cyan-500/40 text-cyan-300 text-xs font-bold shadow">
                    🌐 FB: Văn Nguyên
                </span>
                <span class="px-3 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 text-xs font-bold shadow">
                    💛 LocketGOLD VIP
                </span>
                <span class="px-3 py-1.5 rounded-full bg-slate-900 border border-teal-400/40 text-teal-300 text-xs font-semibold shadow">
                    🐳 Bug là tính năng
                </span>
            </div>

            <!-- General Tags -->
            <p class="text-xs font-bold text-slate-400 mb-2">🎨 General</p>
            <div class="flex flex-wrap gap-2">
                <span class="px-3 py-1 rounded-full bg-white/10 text-xs font-medium">Aa Văn bản</span>
                <span class="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-medium">⭐ Review</span>
                <span class="px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 text-xs font-medium">📢 Bình chọn</span>
                <span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-medium">🎵 Đang phát</span>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'anime_art';
        let isProcessing = false;
        let isRendered = false;
        let originalPhotoData = null;

        function selectFilter(filter, label) {
            currentFilter = filter;
            document.getElementById('filterLabel').innerText = label;
        }

        function toggleCaptionSheet() {
            const sheet = document.getElementById('captionSheet');
            sheet.classList.toggle('translate-y-full');
        }

        // Đổi ảnh bằng cách chọn file từ máy tính
        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    document.getElementById('previewImg').src = ev.target.result;
                    document.getElementById('previewImg').classList.remove('hidden');
                    document.getElementById('webcam').classList.add('hidden');
                    originalPhotoData = ev.target.result;
                    resetPostPhotoState();
                };
                reader.readAsDataURL(file);
            }
        };

        // Bật webcam máy tính
        async function toggleWebcam() {
            const video = document.getElementById('webcam');
            const img = document.getElementById('previewImg');
            if (video.classList.contains('hidden')) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                    img.classList.add('hidden');
                } catch (err) {
                    alert('Không thể mở webcam: ' + err.message);
                }
            } else {
                video.classList.add('hidden');
                img.classList.remove('hidden');
            }
        }

        function resetPostPhotoState() {
            isRendered = false;
            document.getElementById('dotsIndicator').classList.add('hidden');
            document.getElementById('btnCaption').classList.add('hidden');
            document.getElementById('shutterInner').className = 'w-full h-full rounded-full bg-white shadow-lg';
            document.getElementById('shutterInner').innerHTML = '';
        }

        // Chụp ảnh & Rửa ảnh qua AI
        async function takePhoto() {
            if (isProcessing) return;

            if (isRendered) {
                // Nhấn nút X để chụp lại
                resetPostPhotoState();
                if (originalPhotoData) {
                    document.getElementById('previewImg').src = originalPhotoData;
                }
                return;
            }

            const overlay = document.getElementById('developingOverlay');
            overlay.classList.remove('hidden');
            isProcessing = true;

            // Đổi nút chụp thành nút X xanh như video
            const shutterInner = document.getElementById('shutterInner');
            shutterInner.className = 'w-full h-full rounded-full bg-emerald-500 shadow-lg flex items-center justify-center text-white text-xl font-bold';
            shutterInner.innerHTML = '<i class="fa-solid fa-xmark"></i>';

            try {
                // Chuẩn bị ảnh gửi sang Render AI
                let blobToSend;
                const img = document.getElementById('previewImg');
                const video = document.getElementById('webcam');

                const canvas = document.createElement('canvas');
                canvas.width = 720;
                canvas.height = 720;
                const ctx = canvas.getContext('2d');

                if (!video.classList.contains('hidden')) {
                    ctx.drawImage(video, 0, 0, 720, 720);
                } else {
                    ctx.drawImage(img, 0, 0, 720, 720);
                }

                blobToSend = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));

                // Gọi tới máy chủ Render AI của bạn
                const filterParam = currentFilter === 'none' ? 'vintage_film' : currentFilter;
                const resp = await fetch(`https://locket-gold-m1xo.onrender.com/process?filter=${filterParam}`, {
                    method: 'POST',
                    body: blobToSend,
                    headers: { 'Content-Type': 'image/jpeg' }
                });

                if (resp.ok) {
                    const resultBlob = await resp.blob();
                    const resultUrl = URL.createObjectURL(resultBlob);
                    document.getElementById('previewImg').src = resultUrl;
                    document.getElementById('previewImg').classList.remove('hidden');
                    document.getElementById('webcam').classList.add('hidden');
                }
            } catch (e) {
                console.error('Lỗi rửa ảnh:', e);
            } finally {
                overlay.classList.add('hidden');
                isProcessing = false;
                isRendered = true;
                // Hiện thanh chấm lướt ảnh và nút tin nhắn
                document.getElementById('dotsIndicator').classList.remove('hidden');
                document.getElementById('btnCaption').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
